name: mcp-agent-contract

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  contract:
    name: Agent contract regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (with catalog DB from Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent contract gate
        run: pytest tests/test_mcp_agent_contract.py tests/test_description_specs.py -q
