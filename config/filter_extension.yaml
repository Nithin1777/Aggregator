# Filter extension: vendor-backed, production-facing spec filters.
#
# These attributes are merged into config/taxonomy.yaml at load time and are
# populated by scripts/promote_vendor_specs.py.
categories:
- id: resistors
  attributes:
  - key: resistance_ohm
    display_name: Resistance
    type: float
    unit: ohm
    range:
    - 0.0001
    - 1000000000
  - key: power_w
    display_name: Power Rating
    type: float
    unit: W
    range:
    - 0.001
    - 1000
  - key: tolerance_pct
    display_name: Tolerance
    type: float
    unit: '%'
    range:
    - 0.001
    - 20
  - key: package
    display_name: Package
    type: enum
    values:
    - '0201'
    - '0402'
    - '0603'
    - 0805
    - '1206'
    - '1210'
    - '2010'
    - '2512'
    - axial
    - radial
    - through-hole
- id: capacitors
  attributes:
  - key: capacitance_uf
    display_name: Capacitance
    type: float
    unit: uF
    range:
    - 1.0e-06
