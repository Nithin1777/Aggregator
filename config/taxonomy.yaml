# Aggregate catalog taxonomy
#
# This is the single source of truth for every category in the product
# catalog. Each category carries:
#
#   id              canonical slug, stored in products.category_canonical and
#                   returned by the API / UI / MCP tools
#   display         human readable label
#   icon            Lucide icon name used by the web UI
#   description     one line explanation shown in the UI
#   detect_keywords matched against the product TITLE and the vendor's own
#                   category string (token based, plural tolerant)
#   vendor_only     matched against the vendor's category string ONLY
#   title_only      matched against the product TITLE only
#   attributes      the spec attributes that can be filtered on for this
#                   category. Only categories that carry attributes have specs
#                   extracted into `product_specs` (see scripts/backfill_specs.py).
#                   The extractors referenced here must exist in
#                   config/extractors.yaml.
#
# `junk_raw` lists vendor category strings that carry no taxonomic signal
# ("New Products 5", "Popular Products", ...). Products filed under them fall
# back to title matching.

version: 2
advertise_min_fill: 0.4

junk_raw:
  - new product
  - new products
  - popular product
  - popular products
  - best price
  - best prices
  - collection
  - default
  - components
  - component
  - general
  - misc
  - miscellaneous
  - all
  - other
  - others
  - triblade
  - my account

categories:
  # ---------------------------------------------------------------------
  # Passive components
  # ---------------------------------------------------------------------
  - id: resistors
    display: Resistors
    icon: component
    description: Thin-film, thick-film, SMD and power resistors, potentiometers and LDRs.
    detect_keywords:
      - resistor
      - potentiometer
      - trimmer
      - ldr
      - light dependent resistor
      - rheostat
      - resistor network
      - sense resistor

  - id: capacitors
    display: Capacitors
    icon: disc
    description: Ceramic, electrolytic, tantalum, polymer and film capacitors.
    detect_keywords:
      - capacitor
      - mlcc
      - mlccs
      - slcc
      - slccs
      - tantalum
      - electrolytic
      - supercapacitor

  - id: inductors
    display: Inductors
    icon: magnet
    description: Power, RF, wirewound and toroidal inductors plus ferrite beads.
    detect_keywords:
      - inductor
      - inductance
      - ferrite bead
      - ferrite
      - common mode choke

  # ---------------------------------------------------------------------
  # Semiconductors
  # ---------------------------------------------------------------------
  - id: diodes
    display: Diodes
    icon: zap
    description: Zener, Schottky, rectifier, switching and power diodes.
    detect_keywords:
      - diode
      - rectifier
      - zener
      - schottky
      - uf recovery

  - id: transistors
    display: Transistors
    icon: triangle-right
    description: Bipolar, digital and Darlington transistors.
    detect_keywords:
      - transistor
      - bipolar
      - darlington

  - id: semiconductors
    display: MOSFETs & IGBTs
    icon: waypoints
    description: Power MOSFETs, IGBTs and other switching semiconductors.
    detect_keywords:
      - mosfet
      - igbt
      - fet

  - id: thyristors
    display: Thyristors
    icon: toggle-right
    description: SCRs, TRIACs and DIACs for power control.
    detect_keywords:
      - thyristor
      - scr
      - triac
      - diac

  # ---------------------------------------------------------------------
  # Integrated circuits
  # ---------------------------------------------------------------------
  - id: microcontrollers
    display: Microcontrollers
    icon: microchip
    description: 8-bit, 16-bit, 32-bit and ARM microcontrollers.
    detect_keywords:
      - microcontroller
      - mcu

  - id: integrated-circuits
    display: Integrated Circuits
    icon: cpu
    description: Logic, amplifiers, regulators, memory, interface and driver ICs.
    detect_keywords:
      - integrated circuit
      - amplifier
      - comparator
      - regulator
      - logic
      - opamp
      - op amp
      - transceiver
      - buffer
      - multiplexer
      - demultiplexer
      - mux
      - demux
      - adc
      - dac
      - driver ic
      - gate driver
      - drivers and interfaces
      - interface ic
      - memory ic
      - sram
      - dram
      - eeprom
      - frequency management
      - clock timing
      - smd ic
      - switching ic
      - active filter
      - optocoupler
      - photocoupler
      - ic
    title_only:
      - ic

  # ---------------------------------------------------------------------
  # Electromechanical
  # ---------------------------------------------------------------------
  - id: sensors
    display: Sensors
    icon: thermometer
    description: Temperature, humidity, gas, ultrasonic, IMU, light and load sensors.
    detect_keywords:
      - sensor
      - thermocouple
      - thermistor
      - pyranometer
      - ultrasonic
      - proximity
      - accelerometer
      - gyroscope
      - imu
      - lidar
      - radar
      - barometer
      - humidity
      - hall
      - load cell
      - fingerprint
      - photoelectric
      - soil moisture
      - air quality
      - water quality
      - flow sensor
      - level sensor
      - pressure sensor
      - transducer
      - ecg
      - emg
      - pir
      - ir sensor

  - id: connectors
    display: Connectors
    icon: plug
    description: Headers, sockets, USB, RF, circular, terminal blocks and jacks.
    detect_keywords:
      - connector
      - receptacle
      - housing
      - header
      - terminal block
      - terminal
      - jack
      - socket
      - d sub
      - circular
      - din
      - ffc
      - frc
      - rf connector
      - backplane
      - pin header
      - jumper wire
      - dupont
      - wire to board
      - usb connector
      - usb type c
      - pcb adapter
    vendor_only:
      - usb

  - id: switches
    display: Switches
    icon: toggle-left
    description: Tactile, push button, rocker, toggle, slide and rotary switches.
    detect_keywords:
      - switch
      - push button
      - pushbutton
      - rocker
      - toggle
      - slide switch
      - rotary switch
      - microswitch
      - keypad

  - id: relay
    display: Relays
    icon: signal
    description: Power, signal, automotive, latching, SSR and time-delay relays.
    detect_keywords:
      - relay
      - relays
    vendor_only:
      - relay module
      - optocoupler module
      - power relay
      - time delay relay
    attributes:
      - key: channels
        display_name: Channels
        type: integer
        range: [1, 32]
        extract:
          - channels_regex

  # ---------------------------------------------------------------------
  # Opto / display
  # ---------------------------------------------------------------------
  - id: displays
    display: Displays
    icon: monitor
    description: LCD, OLED, TFT, e-Ink, HMI and segment displays.
    detect_keywords:
      - display
      - lcd
      - oled
      - tft
      - e ink
      - eink
      - segment
      - hmi
      - 7 inch
      - 16 2

  - id: leds
    display: LEDs
    icon: lightbulb
    description: SMD and through-hole LEDs, indicators, strips and modules.
    detect_keywords:
      - led
      - indicator light
      - panel indicator
      - led strip
      - strip light
      - rgb
      - light emitting
      - lamp

  # ---------------------------------------------------------------------
  # Modules and boards
  # ---------------------------------------------------------------------
  - id: modules
    display: Modules & Boards
    icon: circuit-board
    description: Arduino, Raspberry Pi, ESP32, IoT, breakout and shield boards.
    detect_keywords:
      - module
      - development board
      - dev board
      - board
      - arduino
      - raspberry pi
      - shield
      - breakout
      - hat
      - sbc
      - single board computer
      - espressif
      - esp32
      - esp8266
      - node mcu
      - stm32
      - teensy
      - micro bit
      - beaglebone
      - jetson
      - wemos
      - seeed
      - df robot
      - cytron
      - ai thinker
      - interface module
      - usb interface module
      - breadboard
      - rotary encoder
      - antenna
      - rfid
      - wireless
      - transmitter receiver
      - transmitters and receivers
      - rf transmitter
      - ir receiver
      - remote control
      - bluetooth
      - wifi router
      - wifi module

  # ---------------------------------------------------------------------
  # Power
  # ---------------------------------------------------------------------
  - id: power
    display: Power & Converters
    icon: bolt
    description: SMPS, AC-DC and DC-DC converters, buck/boost modules, adapters and BMS.
    detect_keywords:
      - power supply
      - ac to dc
      - dc to dc
      - buck
      - boost converter
      - converter
      - inverter
      - power adapter
      - dc adapter
      - solar
      - smps
      - ups
      - hi link
      - bms
      - power bank
      - power module
      - power distribution
      - transformer

  - id: battery
    display: Batteries & Chargers
    icon: battery-charging
    description: Li-ion, LiPo, NiMH cells, packs, holders and chargers.
    detect_keywords:
      - battery
      - batteries
      - lipo
      - li-ion
      - lifepo4
      - '18650'
    vendor_only:
      - battery charger
      - battery pack
      - li-ion charger
    attributes:
      - key: voltage
        display_name: Voltage
        type: enum
        unit: V
        # Open enum: battery voltages are open-ended (1.2V, 3.7V, 7.4V, 11.1V,
        # 22.2V, 51.2V, ...). Stored as a numeric string; ordering operators work
        # via CAST(value AS REAL).
        extract:
          - voltage_regex
      - key: cells
        display_name: Cell Count
        type: enum
        values: ["1s", "2s", "3s", "4s", "5s", "6s", "7s", "8s", "10s", "12s", "14s", "16s"]
        extract:
          - cells_regex
      - key: capacity_mah
        display_name: Capacity
        type: integer
        unit: mAh
        range: [10, 100000]
        extract:
          - capacity_mah_regex
          - capacity_ah_regex
      - key: discharge_c
        display_name: Discharge Rate (C)
        type: integer
        unit: C
        range: [1, 300]
        extract:
          - c_rate_regex
      - key: chemistry
        display_name: Chemistry
        type: enum
        values: ["lipo", "liion", "lifepo4", "nimh", "leadacid"]
        extract:
          - chemistry_regex

  - id: motor
    display: Motors & Drivers
    icon: cog
    description: DC, stepper, servo, gear motors and their driver boards.
    detect_keywords:
      - motor
      - motors
      - bldc
      - stepper
    vendor_only:
      - geared motor
      - motor driver
      - dc motor
      - servo motor
      - brushless
    attributes:
      - key: voltage
        display_name: Operating Voltage
        type: enum
        unit: V
        values: ["3.3", "3.7", "5", "6", "7.4", "9", "12", "14.8", "24", "36", "48"]
        extract:
          - voltage_regex
      - key: rpm
        display_name: Speed (RPM)
        type: integer
        unit: RPM
        range: [1, 50000]
        extract:
          - rpm_regex
      - key: current_a
        display_name: Rated Current
        type: float
        unit: A
        extract:
          - current_a_regex
      - key: torque_kgcm
        display_name: Holding Torque (kg-cm)
        type: float
        unit: kg-cm
        range: [0.01, 500]
        extract:
          - torque_kgcm_regex

