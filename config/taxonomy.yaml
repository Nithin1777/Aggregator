    icon: printer-3d
    description: 3D printers, filaments, nozzles, extruders and printer spare parts.
    detect_keywords:
      - 3d printer
      - 3d print
      - 3d printing
      - filament
      - nozzle
      - extruder
      - printer bed
      - resin
      - ender
      - creality
      - bambu
      - prusa
      - anycubic
      - sovol
      - elegoo
      - atomstack

  - id: kits
    display: DIY Kits & Education
    icon: graduation-cap
    description: Arduino kits, STEM kits, learning kits and robotics bundles.
    detect_keywords:
      - kit
      - stem
      - educational
      - learning kit
      - robot kit
      - arduino kit
