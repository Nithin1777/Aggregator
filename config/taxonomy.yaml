    detect_keywords:
      - camera
      - lens
      - arducam
      - webcam
      - thermal camera
      - thermal imaging
      - vision camera
      - optical flow
      - depth camera

  # ---------------------------------------------------------------------
  # Tools and hardware
  # ---------------------------------------------------------------------
  - id: tools
    display: Tools & Measurement
    icon: wrench
    description: Multimeters, soldering stations, oscilloscopes, hand and power tools.
    detect_keywords:
      - tool
      - multimeter
      - soldering
      - solder
      - screwdriver
      - pliers
      - wrench
      - tweezers
      - bench
      - oscilloscope
      - signal generator
      - clamp meter
      - scale
      - measuring tape
      - endoscope
      - microscope
      - heat gun
      - drill
      - programmer
      - scanner
      - probe
      - sound level meter
    vendor_only:
      - meter

  - id: hardware
    display: Hardware & Mechanical
    icon: nut
    description: Nuts, bolts, spacers, standoffs, extrusion profiles and craft supplies.
    detect_keywords:
      - hardware
      - mechanical
      - nut
      - bolt
      - screw
